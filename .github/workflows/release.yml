name: Release

# Builds the Windows installers and attaches them to a GitHub Release.
#
# Triggered only by a version tag, because Windows runners bill at 2x against
# the private-repo minute allowance and this job is far slower than the test
# job. To cut a release:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# NOTE ON DISTRIBUTION: this repository is private, so a GitHub Release is not
# a delivery channel for end users -- they would each need repo access. It is
# the canonical, reproducible build and the version archive. Staff still get
# the executable from the network share; this is where you fetch the copy to
# put there.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # required to create the release and upload assets

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Gate the release on the same checks as an ordinary push. A tag should
      # never produce an artifact that a normal commit would have failed.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build installers
        # The build is unsigned. Disabling auto-discovery stops electron-builder
        # hunting for a certificate and failing confusingly when it finds none.
        #
        # `npm run dist` passes `--publish never`. Without it, electron-builder
        # detects CI plus a matching tag and tries to publish to GitHub Releases
        # on its own, then fails with "GitHub Personal Access Token is not set"
        # AFTER both installers have been built successfully -- which reads like
        # a build failure but isn't. We publish with `gh` further down instead,
        # to keep the dependency surface small.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem release -Filter *.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      # Fail loudly rather than shipping a build containing credentials. The
      # app is designed so the administrator supplies the client ID and secret
      # separately; this asserts that design actually holds in the artifact.
      - name: Assert no credentials in the build
        shell: pwsh
        run: |
          $hits = Select-String -Path release\**\* -Pattern 'OEQ_CLIENT_SECRET','client_secret=' -SimpleMatch -List -ErrorAction SilentlyContinue
          if ($hits) { $hits | ForEach-Object { Write-Host "FOUND: $($_.Path)" }; throw 'Possible credential material in release artifacts' }
          Write-Host 'No credential markers found in release artifacts.'

      - name: Upload artifacts to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: release/*.exe
          retention-days: 90

      - name: Create GitHub Release
        # gh is preinstalled on GitHub runners. Used in preference to a
        # third-party action to keep the supply-chain surface small.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @"
          Windows build of the openEQUELLA Bulk Uploader desktop app.

          ### Read this first if you are upgrading

          **You will be asked for your sign-in details once more.** This version
          stores them differently, so the ones saved by an earlier version cannot
          be read and are discarded rather than half-understood. The Setup screen
          says so when it happens. Enter them again and it will not ask twice.

          **Check the "Field that records the attachment ID" box on Setup.** It
          is new, and it must say ``BYUI_extended/attachments/attachment`` for
          BYU-Idaho. Left blank, your contributions are created without that
          field and nothing warns you. Your files are attached either way -- it
          is the metadata copy of the attachment's ID that goes missing.

          ### What is fixed

          - **The progress bar was lying.** It showed a full, completed bar from
            the moment every run started -- it had never worked. Now it moves.
          - **Sign out and Forget now actually end your openEQUELLA session**, not
            just the copy on this computer. If the site cannot confirm it, the app
            says so instead of claiming you are signed out.
          - **Duplicate checking no longer reports "no duplicates" when it could
            not look.** If it cannot search -- no title field, or a session that
            has quietly lapsed -- it says "could not check" rather than "clean".
          - **The check command** (``oeq-upload check``) is now a nine-point
            report that says what each failure means for a real run.

          ### What is new, mostly for other institutions

          This version works at **any** openEQUELLA site, not only BYU-Idaho.
          Sign in with an ordinary openEQUELLA username and password; collections
          and their metadata fields are read from the site itself rather than
          built in. If you only use BYU-Idaho, this changes nothing for you
          beyond the two upgrade notes above.

          ### Which file do I want?

          - **Setup .exe** -- installer. Start Menu shortcut, uninstaller, and you
            see the security warning below only once. Take this if you will use
            the tool more than once.
          - **Plain .exe** -- single file, nothing installed. Good for trying it
            out or for machines you cannot install onto. You will see the
            security warning each time you are given a new copy.

          Both keep settings in the same place, so you can switch without
          re-entering credentials.

          ### Before you start

          **This download contains no credentials.** The OAuth client ID, secret
          and redirect URL are supplied separately by the administrator and are
          entered once on first run. See docs/INSTALL.md.

          The build is unsigned, so Windows SmartScreen will warn on first run.
          The dialog offers only **Don't run** until you click **More info** --
          then **Run anyway** appears. It means "not code-signed", not "unsafe".

          ### Drafts and publishing

          You choose per upload. **Draft is the default**; **Published** is also
          available and requires typing the item count to confirm, because the
          target collection has no review queue and there is no undo.
          "@
          gh release create "$env:GITHUB_REF_NAME" (Get-ChildItem release -Filter *.exe | ForEach-Object { $_.FullName }) --title "$env:GITHUB_REF_NAME" --notes $notes
