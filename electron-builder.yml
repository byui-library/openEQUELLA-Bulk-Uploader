appId: edu.byui.oeq-bulk-uploader
productName: openEQUELLA Bulk Uploader
directories:
  output: release
files:
  - dist-desktop/**/*
  - node_modules/**/*
  - package.json
  # --------------------------------------------------------------------------
  # @modelcontextprotocol/sdk (src/mcp/, the maintainer-facing MCP server) and
  # its dependency-only tree ride along under `node_modules/**/*` above even
  # though nothing under src/desktop or src/core imports them -- confirmed by
  # walking package-lock.json's dependency graph and diffing everything
  # reachable from @modelcontextprotocol/sdk against everything reachable from
  # what the desktop app and core actually depend on (commander, csv-parse,
  # exceljs, fast-xml-parser, zod). Every name below is unreachable from that
  # second set; each one is excluded here individually (rather than a single
  # broad exclusion) precisely so nothing gets excluded on a guess. Notably
  # `zod` itself is NOT in this list -- it's also required by
  # src/core/state.ts (manifest load/save), which is reachable from
  # src/desktop/handlers.ts, so it has to stay.
  #
  # Re-derive this list (e.g. after a dependency bump) with:
  #   node -e "<see the graph-diff script used to generate this in the Task 9 session notes>"
  # and confirm with `npx asar list release/win-unpacked/resources/app.asar`
  # that no @modelcontextprotocol/express/ajv/etc. trace remains.
  - "!node_modules/@hono/**/*"
  - "!node_modules/@modelcontextprotocol/**/*"
  - "!node_modules/accepts/**/*"
  - "!node_modules/ajv/**/*"
  - "!node_modules/ajv-formats/**/*"
