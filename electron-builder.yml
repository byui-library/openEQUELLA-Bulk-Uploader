# handlers.ts#resolveSchemaPath reads this at runtime to validate spreadsheet
# xpaths. `to:` is relative to the app's resources directory (what
# process.resourcesPath points at when packaged), NOT to the project root --
# so `to: schema/_entity.xml` lands at `<resourcesPath>/schema/_entity.xml`,
# exactly what resolveSchemaPath's packaged branch expects. Verified by
# inspecting the built release tree in Task 9 (see docs/INSTALL.md context /
# session handoff): a `to:` of just `schema` would still work (electron-builder
# treats a directory-less `to` on a single file as the destination file path
# only when it ends without a trailing slash and matches the source basename),
# but being explicit here removes any doubt.
extraResources:
  - from: schema/_entity.xml
    to: schema/_entity.xml
  # The starter-kit template CSV + sample file the Choose screen's "Save a
  # template and sample file..." button copies out for the operator
  # (handlers.ts's STARTER_KIT_FILES / resolveResourcePath -- the SAME
  # packaged/unpackaged split as resolveSchemaPath and the `to:` reasoning
  # above, just parameterised). `to: template` (a directory, no trailing
  # file) copies the whole `resources/template` folder to
  # `<resourcesPath>/template/`, which is exactly what
  # resolveResourcePath's packaged branch expects.
  - from: resources/template
    to: template
  # Collection templates -- the profile JSONs the Extract flow's "Start from"
  # choice offers (extractHandlers.ts's templatesDir, resolved by the same
  # resolveResourcePath split as the two entries above). Without this the
  # chooser is EMPTY in a packaged build and full in development, which is the
  # kind of difference nobody notices until an installer is in someone's hands.
  - from: templates
    to: templates
win:
  target:
    - portable
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
